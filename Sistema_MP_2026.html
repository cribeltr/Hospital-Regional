<style>
:root{
  --ink:#16242E; --ink-soft:#51626E; --line:#DCE4E8; --bg:#F4F7F8; --card:#FFFFFF;
  --teal:#0E7C66; --teal-bg:#E2F2EC;
  --amber:#B26A12; --amber-bg:#FBEFD9;
  --red:#B3402E; --red-bg:#F9E5E0;
  --blue:#1E5A8A; --blue-bg:#E3EEF7;
  --grey-bg:#EDF1F3;
  --focus:#0E7C66;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px}
header{background:var(--ink);color:#fff;padding:14px 22px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{font-family:'Archivo',sans-serif;font-weight:750;font-size:19px;letter-spacing:.2px;font-stretch:112%}
header h1 span{color:#5CC9AE}
header .sub{font-size:12px;color:#9FB2BC}
.kpis{display:flex;gap:10px;padding:14px 22px 0;flex-wrap:wrap}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:118px}
.kpi b{font-family:'Archivo',sans-serif;font-size:21px;font-weight:760;display:block}
.kpi small{color:var(--ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.kpi.ok b{color:var(--teal)} .kpi.warn b{color:var(--amber)} .kpi.bad b{color:var(--red)}
.toolbar{display:flex;gap:10px;align-items:center;padding:14px 22px;flex-wrap:wrap}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tabs button{border:0;background:transparent;padding:9px 18px;font:inherit;font-weight:600;color:var(--ink-soft);cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card)}
.search input:focus{outline:2px solid var(--focus);outline-offset:-1px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink-soft)}
.btn-clear{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;color:var(--ink-soft);cursor:pointer}
.btn-clear:hover{color:var(--red);border-color:var(--red)}
.count{font-size:12px;color:var(--ink-soft);white-space:nowrap}
.wrap{padding:0 22px 30px}
.tablebox{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 235px)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:980px}
thead th{position:sticky;top:0;background:#FAFCFC;border-bottom:2px solid var(--line);padding:0;z-index:5;text-align:left}
.th-in{display:flex;align-items:center;gap:4px;padding:9px 8px 9px 12px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);font-weight:600;white-space:nowrap}
.fbtn{border:0;background:transparent;cursor:pointer;padding:2px;border-radius:5px;display:flex;color:#9AAAB4}
.fbtn:hover{background:var(--grey-bg);color:var(--ink)}
.fbtn.active{color:var(--teal);background:var(--teal-bg)}
.fbtn svg{width:13px;height:13px}
tbody td{padding:8px 12px;border-bottom:1px solid #ECF1F3;white-space:nowrap;vertical-align:middle}
tbody tr:hover{background:#F6FAF9}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px}
.eqname{font-weight:600}
.dim{color:var(--ink-soft);font-size:12px}
.tag{display:inline-block;padding:2.5px 9px;border-radius:99px;font-size:11.5px;font-weight:600}
.t-ok{background:var(--teal-bg);color:var(--teal)} .t-warn{background:var(--amber-bg);color:var(--amber)}
.t-bad{background:var(--red-bg);color:var(--red)} .t-grey{background:var(--grey-bg);color:var(--ink-soft)}
.t-blue{background:var(--blue-bg);color:var(--blue)}
.pend{font-family:'Archivo',sans-serif;font-weight:740;font-size:14px}
.pend.z{color:#B9C5CC}
.gantt{display:inline-flex;gap:2px}
.gcell{width:13px;height:16px;border-radius:3px;background:#EEF2F4;position:relative}
.gcell.gx{background:#C7D6E2} .gcell.gsi{background:var(--teal)} .gcell.gc{background:#E8B453}
.gcell.gbad{background:var(--red)} .gcell.gr{background:var(--blue)}
.gcell .tip{display:none;position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:20}
.gcell:hover .tip{display:block}
.fpanel{position:fixed;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(22,36,46,.18);z-index:50;width:240px;display:flex;flex-direction:column;max-height:340px}
.fpanel input{margin:10px 10px 6px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:12.5px}
.fpanel .opts{overflow:auto;padding:4px 6px;flex:1}
.fpanel label{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:12.5px}
.fpanel label:hover{background:var(--grey-bg)}
.fpanel .foot{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}
.fpanel .foot button{flex:1;border:0;border-radius:8px;padding:7px;font:inherit;font-weight:600;cursor:pointer}
.f-apply{background:var(--ink);color:#fff} .f-reset{background:var(--grey-bg);color:var(--ink-soft)}
.empty{padding:40px;text-align:center;color:var(--ink-soft)}
.btn-reg{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 12px;font:inherit;font-size:12px;font-weight:600;color:var(--blue);cursor:pointer;white-space:nowrap}
.btn-reg:hover{border-color:var(--blue);background:var(--blue-bg)}
.btn-reg.done{color:var(--teal);border-color:var(--teal-bg);background:var(--teal-bg)}
.overlay{position:fixed;inset:0;background:rgba(22,36,46,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:420px;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h2{font-family:'Archivo',sans-serif;font-size:16px;font-weight:740;margin-bottom:2px}
.modal .msub{font-size:12px;color:var(--ink-soft);margin-bottom:14px}
.modal label.fl{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);margin:12px 0 5px}
.modal input[type=date],.modal select,.modal textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff}
.modal textarea{resize:vertical;min-height:64px}
.modal input:focus,.modal select:focus,.modal textarea:focus{outline:2px solid var(--focus);outline-offset:-1px}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink-soft)}
.seg button.si.on{background:var(--teal-bg);border-color:var(--teal);color:var(--teal)}
.seg button.no.on{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.macts{display:flex;gap:8px;margin-top:18px}
.macts button{border:0;border-radius:9px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
.m-save{flex:1;background:var(--ink);color:#fff}
.m-cancel{background:var(--grey-bg);color:var(--ink-soft)}
.m-del{background:var(--red-bg);color:var(--red)}
.regdate{font-size:11.5px;color:var(--ink-soft)}
.btn-io{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px}
.btn-io:hover{border-color:var(--ink)}
.btn-rec{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;gap:7px}
.btn-rec .dot{width:9px;height:9px;border-radius:50%;background:#B9C5CC}
.btn-rec.on{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.btn-rec.on .dot{background:var(--red);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.datasrc{font-size:11px;color:var(--ink-soft);padding:0 22px 8px}
.batchbar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 30px rgba(22,36,46,.35);z-index:60;font-size:13px}
.batchbar .bb-go{border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;background:#5CC9AE;color:var(--ink);cursor:pointer}
.batchbar .bb-x{border:0;border-radius:8px;padding:8px 12px;font:inherit;font-weight:600;background:rgba(255,255,255,.14);color:#fff;cursor:pointer}
.selchk{width:15px;height:15px;accent-color:var(--teal);cursor:pointer}
.disc{display:inline-block;font-family:'Archivo',sans-serif;font-weight:760;color:var(--amber);background:var(--amber-bg);border-radius:6px;padding:1px 6px;font-size:12px;cursor:help}
.kpi-click{cursor:pointer;user-select:none}
.kpi-click:hover{border-color:var(--amber)}
.kpi-click.sel{outline:2px solid var(--amber);outline-offset:-1px}
.aviso{background:var(--amber-bg);color:var(--amber);border-radius:9px;padding:9px 11px;font-size:12.5px;margin-top:8px;line-height:1.4}
.pdoc{cursor:help;font-size:13px}
.confl{display:inline-block;font-weight:700;color:var(--red);background:var(--red-bg);border-radius:6px;padding:1px 6px;font-size:12px;cursor:help}
.eqlink{cursor:pointer;border-bottom:1px dashed #B9C5CC}
.eqlink:hover{color:var(--teal);border-bottom-color:var(--teal)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:12.5px;margin:10px 0 4px}
.fgrid div b{font-weight:600}
.fgrid .lbl{color:var(--ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.fsum{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.fsum span{background:var(--grey-bg);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600}
.tl-item.mp::before{background:var(--teal)}
.tl-item.mpw::before{background:#E8B453}
.btn-falla{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 12px;font:inherit;font-size:12px;font-weight:600;color:var(--red);cursor:pointer;white-space:nowrap}
.btn-falla:hover{border-color:var(--red);background:var(--red-bg)}
.btn-falla.open{color:var(--amber);border-color:var(--amber-bg);background:var(--amber-bg)}
.modal.wide{max-width:560px;max-height:88vh;overflow:auto}
.tl{margin:12px 0;border-left:2px solid var(--line);padding-left:14px}
.tl-item{position:relative;padding:6px 0 10px}
.tl-item::before{content:'';position:absolute;left:-19.5px;top:12px;width:9px;height:9px;border-radius:50%;background:var(--blue);border:2px solid #fff}
.tl-item.fin::before{background:var(--teal)}
.tl-item.seg::before{background:#C9D4DB}
.tl-item b{font-size:13px}
.tl-item .tld{font-size:12px;color:var(--ink-soft);line-height:1.45}
.alerta20{background:var(--red-bg);color:var(--red);border-radius:9px;padding:9px 11px;font-size:12.5px;margin:8px 0;font-weight:600}
.mrow{display:flex;gap:10px}.mrow>*{flex:1}
.subbtns{display:flex;gap:8px;margin-top:14px}
.subbtns button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}
.subbtns button:hover{border-color:var(--ink)}
@media(max-width:700px){.datasrc{padding:0 12px 8px}}
@media(max-width:700px){
  header,.toolbar,.kpis{padding-left:12px;padding-right:12px}
  .wrap{padding:0 12px 20px}
  .kpi{min-width:calc(50% - 6px);flex:1}
}
</style>

function eqIdPart(e){return e.inv||e.serie||('id'+e.id);}
function hitosOrden(c){return [...c.hitos].sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));}
function casoEstado(c){
  const h=hitosOrden(c), u=h[h.length-1];
  if(!u)return 'No operativo';
  if(u.tipo==='ENTREGA')return 'Operativo';
  if(u.tipo==='ENVIO'||u.tipo==='VISITA')return 'En servicio técnico';
  return 'No operativo';
}
function diasDesde(f){if(!f)return '';const d=Math.floor((Date.now()-new Date(f+'T00:00:00').getTime())/86400000);return d<0?0:d;}
function ultHito(c){const h=hitosOrden(c);return h[h.length-1]||null;}
function ultNovedad(c){
  let f='';
  c.hitos.forEach(x=>{if(x.fecha>f)f=x.fecha;});
  (c.seg||[]).forEach(x=>{if(x.fecha>f)f=x.fecha;});
  return f;
}
function casoDe(idpart){return CASOS.find(c=>!c.cerrado&&c.eqRef===idpart);}

function buildIndex(){
  EVENTOS=[];
  ROWS.forEach(e=>{
    let pend=0, ult='', estado='Operativo';
    MESES.forEach((m,i)=>{
      const mv=e.meses[m]; if(!mv) return;
      const [p,r]=mv;
      if(p||r) EVENTOS.push({eq:e,mes:m,mi:i,p:p||'—',r:r||'Pendiente'});
      if(r) ult=m;
      if(r==='Baja') estado='Baja';
      else if(r==='FS'&&estado!=='Baja') estado='Fuera de servicio';
      else if(r==='NU'&&estado==='Operativo') estado='No ubicable';
      if(p && i<=MES_ACTUAL && !OK.has(r) && r!=='Baja') pend++;
    });
    e._estado=estado; e._pend=pend; e._ult=ult||'—';
  });
  // estado derivado de casos correctivos abiertos (nunca se edita a mano)
  CASOS.forEach(c=>{if(!c.cerrado){const e=eqDe(c.eqRef);if(e)e._estado=casoEstado(c);}});
  // anexar eventos no oficiales (reprogramaciones creadas en el programa)
  for(const k in VIRT){
    const [idpart,mes]=k.split('|');
    const mi=MESES.indexOf(mes); if(mi<0)continue;
    const eq=eqDe(idpart); if(!eq)continue;
    if(eq.meses[mes]&&eq.meses[mes][0])continue; // ya existe evento oficial ese mes
    EVENTOS.push({eq,mes,mi,p:VIRT[k].prog||'R',r:'Pendiente',virt:true,origen:VIRT[k].origen||''});
  }
}
buildIndex();

let view='eq';
let filters={eq:{},pl:{},co:{}};   // {colKey: Set(valores)}

function val(row,k){
  if(k==='_ejecutor'||k==='_fecha'||k==='_oper'){
    const g=REG[evKey(row)];
    if(!g)return '';
    return k==='_ejecutor'?g.ej:k==='_fecha'?g.fecha:(g.oper===true?'Sí':g.oper===false?'No':'');
  }
  if(view==='co'){
    const c=row, e=eqDe(c.eqRef)||{};
    switch(k){
      case 'inv':return e.inv||'';case 'equipo':return e.equipo||'';case 'serie':return e.serie||'';case 'servicio':return e.servicio||'';
      case 'folio':return c.folio||'';case 'ing':return c.ing||'';case 'inicio':return c.fecha||'';
      case '_estadoCo':return c.cerrado?'Cerrado':casoEstado(c);
      case '_uh':{const u=ultHito(c);return u?`${HITOS_DEF[u.tipo].n} · ${u.fecha}`:'';}
      case '_nov':return String(diasDesde(ultNovedad(c)));
      default:return '';
    }
  }
  if(view==='pl'){ if(k in row) return String(row[k]); return String(row.eq[k]??''); }
  return String(row[k]??'');
}
function baseRows(){ return view==='eq'?ROWS:view==='co'?CASOS:EVENTOS; }

function filtered(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const f=filters[view];
  return baseRows().filter(r=>{
    if(view==='pl'&&discOnly){const g=REG[evKey(r)];if(!g||DESC[r.r]||((g.res||'Si')===r.r))return false;}
    if(view==='pl'&&conflOnly){if(!esConflicto(r))return false;}
    if(view==='pl'&&pdocOnly){const g=REG[evKey(r)];if(!(g&&g.pend))return false;}
    if(view==='co'&&coAlertOnly){if(r.cerrado||diasDesde(ultNovedad(r))<=20)return false;}
    for(const k in f){ if(f[k].size && !f[k].has(val(r,k))) return false; }
    if(!q) return true;
    const cols=COLS[view];
    let hay=cols.some(c=>!c.nf||c.k==='_fecha'?val(r,c.k).toLowerCase().includes(q):false);
    if(!hay&&view==='pl'){const g=REG[evKey(r)];if(g&&g.obs&&g.obs.toLowerCase().includes(q))hay=true;}
    if(!hay&&view==='co'&&r.desc&&r.desc.toLowerCase().includes(q))hay=true;
    if(!hay&&view==='eq'){ // buscar también en códigos del año
      hay=Object.values(r.meses).some(([p,res])=>(p&&p.toLowerCase()===q)||(res&&res.toLowerCase()===q));
    }
    return hay;
  });
}

function tagClass(v){
  if(OK.has(v))return 't-ok';
  if(CAUSAL.has(v))return 't-warn';
  if(['FS','No','NU','Baja','Fuera de servicio','No ubicable'].includes(v))return 't-bad';
  if(['X','R','RA','PM'].includes(v))return 't-blue';
  if(v==='Operativo')return 't-ok';
  if(v==='En servicio técnico')return 't-warn';
  if(v==='Cerrado')return 't-grey';
  if(v==='No operativo')return 't-bad';
  return 't-grey';
}
function gcls(p,r){
  if(OK.has(r))return 'gsi'; if(CAUSAL.has(r))return 'gc';
  if(['FS','No','NU','Baja'].includes(r))return 'gbad';
  if(p==='R'||p==='RA')return 'gr'; if(p)return 'gx'; return '';
}
function gantt(e){
  const kBase=(e.inv||e.serie||('id'+e.id))+'|';
  let h='<div class="gantt">';
  MESES.forEach(m=>{
    const mv=e.meses[m];
    if(!mv){
      if(VIRT[kBase+m]){h+=`<div class="gcell gr"><span class="tip">${m}: R* no oficial (reprog. desde ${VIRT[kBase+m].origen||'?'})</span></div>`;return;}
      h+='<div class="gcell"></div>';return;
    }
    const[p,r]=mv;
    const t=`${m}: ${p?DESC[p]||p:''}${p&&r?' → ':''}${r?(DESC[r]||r):''}`;
    h+=`<div class="gcell ${gcls(p,r)}"><span class="tip">${t}</span></div>`;
  });
  return h+'</div>';
}

function render(){
  const rows=filtered(), cols=COLS[view];
  document.getElementById('count').textContent=`${rows.length.toLocaleString('es-CL')} ${view==='eq'?'equipos':view==='co'?'casos':'eventos'}`;
  let h='<table><thead><tr>'+cols.map((c,i)=>{
    const act=filters[view][c.k]&&filters[view][c.k].size?'active':'';
    const btn=c.nf?'':`<button class="fbtn ${act}" onclick="openFilter(event,${i})" title="Filtrar ${c.n}"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg></button>`;
    return `<th><span class="th-in">${c.n}${btn}</span></th>`;
  }).join('')+'</tr></thead><tbody>';
  if(!rows.length){h+=`<tr><td colspan="${cols.length}" class="empty">Sin resultados. Ajusta la búsqueda o limpia los filtros.</td></tr>`;}
  rows.slice(0,1500).forEach((r,ri)=>{
    h+='<tr>'+cols.map(c=>{
      if(c.k==='_gantt')return `<td>${gantt(r)}</td>`;
      if(c.k==='_falla'){
        const ca=casoDe(eqIdPart(r));
        return ca?`<td><button class="btn-falla open" onclick="openCasoDet(${ca.id})">⚠ Caso abierto</button></td>`
                 :`<td><button class="btn-falla" onclick="openFalla(${ri})">Falla</button></td>`;
      }
      if(c.k==='_alerta'){
        const al=!r.cerrado&&diasDesde(ultNovedad(r))>20;
        return al?`<td><span class="tag t-bad" title="Más de 20 días sin novedad">⚠ Perseguir ST</span></td>`:'<td class="dim">—</td>';
      }
      if(c.k==='_acc'){
        return `<td><button class="btn-reg" onclick="openCasoDet(${r.id})">Ver caso</button></td>`;
      }
      if(c.k==='_sel'){
        const k=evKey(r);
        return `<td><input type="checkbox" class="selchk" ${SEL.has(k)?'checked':''} onchange="toggleSel('${k.replace(/'/g,"\\'")}',${ri})"></td>`;
      }
      if(c.k==='_reg'){
        const g=REG[evKey(r)];
        const disc=g&&!DESC[r.r]&&((g.res||'Si')!==r.r);
        const confl=esConflicto(r);
        const pdoc=g&&g.pend;
        return `<td><button class="btn-reg ${g?'done':''}" onclick="openReg(${ri})">${g?'✓ Editar':'Registrar'}</button>${disc?' <span class="disc" title="Registrado aquí, pero la planilla oficial aún no lo refleja">Δ</span>':''}${confl?' <span class="confl" title="Conflicto: planilla dice '+r.r+' y el programa '+( (REG[evKey(r)]||{}).res||'Si')+'. Revisa la carpeta física y resuelve desde Editar">⚠</span>':''}${pdoc?' <span class="pdoc" title="Documento pendiente por generar (ej.: reprogramación)">📄</span>':''}</td>`;
      }
      let v=val(r,c.k);
      if(c.k==='_fecha')return `<td class="regdate">${v||'—'}</td>`;
      if(c.k==='_oper')return v?`<td><span class="tag ${v==='Sí'?'t-ok':'t-bad'}">${v}</span></td>`:'<td class="dim">—</td>';
      if(c.k==='_ejecutor'){const g=REG[evKey(r)];const t=g&&g.obs?` title="${g.obs.replace(/"/g,'&quot;')}"`:'';return `<td${t}>${v||'—'}</td>`;}
      if(c.tag){
        if(c.k==='p'&&r.virt)return `<td><span class="tag t-blue" title="Evento no oficial creado en el programa · MP reprogramada desde ${r.origen||'otro mes'}">R*</span></td>`;
        if(c.k==='r'&&view==='pl'){
          const g=REG[evKey(r)];
          if(g&&g.res){
            if(v==='Pendiente'||!DESC[v])return `<td><span class="tag ${tagClass(g.res)}" title="${DESC[g.res]||''} · resultado registrado en el programa, no oficial">${g.res}*</span></td>`;
            if(g.res!==v)return `<td><span class="tag ${tagClass(v)}" title="Planilla oficial: ${DESC[v]||v}">${v}</span> <span class="tag ${tagClass(g.res)}" title="Registrado en el programa: ${DESC[g.res]||''}">${g.res}*</span></td>`;
          }
        }
        const txt=DESC[v]?`${v}`:v;return `<td><span class="tag ${tagClass(v)}" title="${DESC[v]||''}">${txt||'—'}</span></td>`;}
      if(c.pend)return `<td><span class="pend ${v==='0'?'z':''}">${v}</span></td>`;
      if(c.cls==='eqname'){
        const eqo=view==='pl'?r.eq:(view==='co'?eqDe(r.eqRef):r);
        const ip=eqo?eqIdPart(eqo).replace(/'/g,"\\'"):'';
        return `<td class="eqname">${eqo?`<span class="eqlink" title="Abrir ficha técnica" onclick="openFicha('${ip}')">${v||'—'}</span>`:(v||'—')}</td>`;
      }
      const cls=[c.mono?'mono':'',c.cls||'',c.dim?'dim':''].join(' ');
      return `<td class="${cls}">${v||'—'}</td>`;
    }).join('')+'</tr>';
  });
  CURRENT=rows;
  h+='</tbody></table>';
  if(rows.length>1500)h+=`<div class="empty">Mostrando 1.500 de ${rows.length.toLocaleString('es-CL')} filas — refina la búsqueda para ver el resto.</div>`;
  document.getElementById('box').innerHTML=h;
  document.getElementById('datasrc').textContent='Fuente de datos: '+FUENTE;
  renderBatch();
  renderKpis();
}

function renderKpis(){

  const disc=EVENTOS.filter(e=>{const g=REG[evKey(e)];if(!g)return false;return !DESC[e.r]&&(g.res||'Si')!==e.r;}).length;
  const confl=EVENTOS.filter(e=>esConflicto(e)).length;
  const pdocs=EVENTOS.filter(e=>{const g=REG[evKey(e)];return g&&g.pend;}).length;
  const abiertos=CASOS.filter(c=>!c.cerrado).length;
  const alertas=CASOS.filter(c=>!c.cerrado&&diasDesde(ultNovedad(c))>20).length;

   <div class="kpi"><b>${ROWS.length.toLocaleString('es-CL')}</b><small>Equipos</small></div>

   <div class="kpi warn kpi-click ${discOnly?'sel':''}" onclick="toggleDisc()" title="Registradas en el programa pero aún sin Si en la planilla oficial"><b>${disc.toLocaleString('es-CL')}</b><small>Discrepancias Δ</small></div>
   <div class="kpi bad kpi-click ${conflOnly?'sel':''}" onclick="toggleConfl()" title="El resultado registrado difiere del de la planilla oficial: revisar carpeta física"><b>${confl.toLocaleString('es-CL')}</b><small>Conflictos ⚠</small></div>

   <div class="kpi kpi-click" onclick="setView('co')" title="Casos correctivos abiertos"><b>${abiertos}</b><small>Casos abiertos</small></div>
   <div class="kpi bad kpi-click ${coAlertOnly?'sel':''}" onclick="toggleCoAlert()" title="HOY: casos con más de 20 días sin novedad — perseguir servicio técnico"><b>${alertas}</b><small>Perseguir ST ⚠</small></div>`;

let fCol=null;
function openFilter(ev,ci){
  ev.stopPropagation();
  const c=COLS[view][ci]; fCol=c.k;
  const vals=[...new Set(baseRows().map(r=>val(r,c.k)))].sort((a,b)=>{
    const na=parseFloat(a),nb=parseFloat(b);

    return a.localeCompare(b,'es');
  });

  p.innerHTML=`<input placeholder="Buscar valor…" oninput="fSearch(this.value)">
   <div class="opts" id="fopts">${vals.map(v=>`
     <label><input type="checkbox" value="${v.replace(/"/g,'&quot;')}" ${sel.size===0||sel.has(v)?'checked':''}> ${v||'(vacío)'}</label>`).join('')}
   </div>
   <div class="foot"><button class="f-reset" onclick="fReset()">Todo</button><button class="f-apply" onclick="fApply()">Aplicar</button></div>`;
  const r=ev.target.closest('th').getBoundingClientRect();
  p.style.display='flex';

function fSearch(q){q=q.toLowerCase();document.querySelectorAll('#fopts label').forEach(l=>{l.style.display=l.textContent.toLowerCase().includes(q)?'flex':'none';});}
function fReset(){document.querySelectorAll('#fopts input').forEach(i=>i.checked=true);}
function fApply(){
  const checked=[...document.querySelectorAll('#fopts input')].filter(i=>i.checked).map(i=>i.value);
  const all=document.querySelectorAll('#fopts input').length;
  if(checked.length===all){delete filters[view][fCol];log('filtro quitado',fCol);}
  else {filters[view][fCol]=new Set(checked);log('filtro aplicado',fCol+': '+checked.slice(0,8).join(', ')+(checked.length>8?'…':''));}
  closePanel();render();
}
function closePanel(){document.getElementById('fpanel').style.display='none';}

function checkDesfase(){
  if(!regEv||regEv.virt)return;
  const f=document.getElementById('rFecha').value;
  const box=document.getElementById('desfase');
  if(!f||!box)return;
  const sel=document.getElementById('rRes');
  const esEjec=!sel||sel.value==='Si'||sel.value==='Si-RA';
  const mesEj=parseInt(f.slice(5,7),10)-1;
  if(!esEjec){box.innerHTML='';return;}
  if(mesEj>=0&&mesEj<12&&mesEj!==regEv.mi&&!REG[evKey(regEv)]){
    box.innerHTML=`<div class="aviso">⚠ Ejecutada en ${MESES[mesEj]}, programada en ${regEv.mes}. Al guardar: se mantiene la ${regEv.p} en ${regEv.mes}, se crea un nuevo evento <b>R en ${MESES[mesEj]}</b> con este registro, y queda el <b>documento pendiente</b> por generar.</div>`;
    const p=document.getElementById('rPend'); if(p)p.checked=true;
    const pr=document.getElementById('rProg'); if(pr)pr.value='R';
  } else box.innerHTML='';
}
function onResChange(){
  const sel=document.getElementById('rRes'); if(!sel)return;
  const res=sel.value;
  const esEjec=(res==='Si'||res==='Si-RA');
  const ob=document.getElementById('operBlock'); if(ob)ob.style.display=esEjec?'block':'none';
  const rb=document.getElementById('reprogBlock');
  if(rb)rb.style.display=(GRUPO_B.has(res)&&regEv&&!regEv.virt&&regEv.mi<11&&!REG[evKey(regEv)])?'block':'none';
  checkDesfase();
}
function resolverConfl(quien){
  const k=evKey(regEv), g=REG[k]; if(!g)return;
  if(quien==='planilla'){
    g.res=regEv.r;
    log('conflicto resuelto',`${regEv.eq.equipo} (Inv ${regEv.eq.inv}) ${regEv.mes}: la carpeta confirma ${regEv.r}, registro del programa corregido`);
  }else{
    g.resuelto=true;
    log('conflicto resuelto',`${regEv.eq.equipo} (Inv ${regEv.eq.inv}) ${regEv.mes}: la carpeta confirma ${g.res||'Si'}, se corregirá el Excel oficial (alerta silenciada hasta reimportar)`);
  }
  saveReg();closeReg();render();
}
function setOper(v,btn){
  regOper=v;
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}
function submitReg(){
  const fecha=document.getElementById('rFecha').value;
  const ej=document.getElementById('rEj').value;
  if(!fecha){alert('Indica la fecha de ejecución.');return;}
  if(!ej){alert('Selecciona el ejecutor.');return;}
  if(regOper===null){alert('Indica si el equipo quedó operativo.');return;}
  const obs=document.getElementById('rObs').value.trim();
  const progSel=document.getElementById('rProg');
  const pendChk=document.getElementById('rPend');
  const data={fecha,ej,obs};
  const resSel=document.getElementById('rRes');
  if(resSel)data.res=resSel.value;
  if(progSel)data.prog=progSel.value;
  if(pendChk&&pendChk.checked)data.pend=true;
  data.oper=( (data.res||'Si')==='Si'||(data.res||'Si')==='Si-RA')?regOper:null;
  if(regBatch){
    if(data.oper===undefined)data.oper=esEjec?regOper:null;
    regBatch.forEach(ev=>{REG[evKey(ev)]={...data};});
    log('registro MP en lote',`${regBatch.length} equipos: ${ej}, ${fecha}, resultado ${data.res||'Si'}, operativo ${regOper?'Sí':'No'}`);
    SEL.clear();
  }else{
    const mesEj=parseInt(fecha.slice(5,7),10)-1;
    if(esEjec && !regEv.virt && mesEj>=0 && mesEj<12 && mesEj!==regEv.mi && !REG[evKey(regEv)]){
      // reprogramación: X se mantiene en el mes original, nuevo evento R en el mes de ejecución
      const eq=regEv.eq;
      const kNew=(eq.inv||eq.serie||('id'+eq.id))+'|'+MESES[mesEj];
      const ofic=eq.meses[MESES[mesEj]]&&eq.meses[MESES[mesEj]][0];
      if(!ofic) VIRT[kNew]={origen:regEv.mes,prog:'R'};
      data.prog='R'; data.pend=true;
      REG[kNew]=data;
      saveVirt();buildIndex();
      log('registro MP reprogramada',`${eq.equipo} (Inv ${eq.inv}): programada ${regEv.mes}, ejecutada ${fecha} → nuevo evento R en ${MESES[mesEj]}, ${regEv.p} se mantiene en ${regEv.mes}, DOC PENDIENTE`);
    }else if(GRUPO_B.has(resVal) && !regEv.virt && regEv.mi<11 && !REG[evKey(regEv)] && document.getElementById('rReprog') && document.getElementById('rReprog').checked){
      // causal grupo B: registro de la causal en el mes original + evento R pendiente al mes siguiente
      REG[evKey(regEv)]=data;
      const eq=regEv.eq;
      const mesDest=MESES[regEv.mi+1];
      const kNew=(eq.inv||eq.serie||('id'+eq.id))+'|'+mesDest;
      const ofic=eq.meses[mesDest]&&eq.meses[mesDest][0];
      if(!ofic && !VIRT[kNew]){VIRT[kNew]={origen:regEv.mes,prog:'R'};saveVirt();buildIndex();}
      log('registro causal',`${eq.equipo} (Inv ${eq.inv}) ${regEv.mes}: causal ${resVal} → evento R creado en ${mesDest}, pendiente de ejecución`);
    }else{
      if(regEv.virt && data.prog && VIRT[evKey(regEv)] && VIRT[evKey(regEv)].prog!==data.prog){
        VIRT[evKey(regEv)].prog=data.prog;saveVirt();buildIndex();
      }
      REG[evKey(regEv)]=data;
      log('registro MP',`${TIPO[data.prog||regEv.p]||'MP'} ${regEv.eq.equipo} (Inv ${regEv.eq.inv}) ${regEv.mes}: ${ej}, ${fecha}, resultado ${data.res||'Si'}, operativo ${regOper?'Sí':'No'}${data.pend?', DOC PENDIENTE':''}`);
    }
  }
  lastForm={fecha,ej,oper:regOper,res:data.res||'Si'};
  saveReg();closeReg();render();
}

let SEL=new Set(), regBatch=null, discOnly=false, pdocOnly=false, conflOnly=false;
function toggleSel(k,ri){SEL.has(k)?SEL.delete(k):SEL.add(k);renderBatch();}

function esConflicto(e){
  const g=REG[evKey(e)]; if(!g)return false;
  if(!DESC[e.r])return false;            // planilla sin resultado válido aún → es Δ, no conflicto
  return (g.res||'Si')!==e.r && !g.resuelto;
}

function delReg(){
  if(!confirm(regEv.virt?'¿Eliminar este registro y el evento R creado?':'¿Eliminar este registro?'))return;
  log('registro eliminado',`${regEv.eq.equipo} ${regEv.mes}${regEv.virt?' (evento no oficial eliminado)':''}`);
  delete REG[evKey(regEv)];
  if(regEv.virt){delete VIRT[evKey(regEv)];saveVirt();buildIndex();}
  saveReg();closeReg();render();
}

// ---- ficha técnica por equipo ----
function openFicha(idpart){
  const e=eqDe(idpart); if(!e)return;
  log('ficha técnica',`${e.equipo} (Inv ${e.inv})`);
  const items=[];
  let nProg=0,nOk=0,nCau=0,nPen=0;
  MESES.forEach((m,i)=>{
    const mv=e.meses[m], k=idpart+'|'+m, g=REG[k], vt=VIRT[k];
    if(!mv&&!g&&!vt)return;
    const pOf=mv?mv[0]:'', rOf=mv?mv[1]:'';
    const p=pOf||(vt?vt.prog+'*':'');
    if(p)nProg++;
    const resReg=g?(g.res||'Si'):'';
    const resFinal=resReg||rOf;
    if(resFinal==='Si'||resFinal==='Si-RA')nOk++;
    else if(CAUSAL.has(resFinal))nCau++;
    else if(p&&i<=MES_ACTUAL)nPen++;
    const fSort=(g&&g.fecha)?g.fecha:`2026-${String(i+1).padStart(2,'0')}-01`;
    const tags=[];
    if(rOf)tags.push(`<span class="tag ${tagClass(rOf)}" title="Planilla oficial">${rOf}</span>`);
    if(g&&g.res&&g.res!==rOf)tags.push(`<span class="tag ${tagClass(g.res)}" title="Registrado en el programa">${g.res}*</span>`);
    if(!rOf&&!g)tags.push('<span class="tag t-grey">Pendiente</span>');
    const flags=[g&&g.pend?'📄 doc. pendiente':'',esConflicto({eq:e,mes:m,r:rOf||'Pendiente'})?'⚠ conflicto':''].filter(Boolean).join(' · ');
    const det=g?`${g.fecha||''}${g.ej?' · '+g.ej:''}${g.oper===true?' · operativo Sí':g.oper===false?' · operativo No':''}${g.obs?' · '+g.obs:''}`:'';
    const ok=(resFinal==='Si'||resFinal==='Si-RA');
    items.push({f:fSort,html:`<div class="tl-item ${ok?'mp':'mpw'}"><b>${m} — MP ${p?TIPO[p.replace('*','')]||p:''}${vt?` (no oficial, desde ${vt.origen||'?'})`:''}</b> ${tags.join(' ')}<div class="tld">${det}${flags?(det?'<br>':'')+flags:''}</div></div>`});
  });
  CASOS.filter(c=>c.eqRef===idpart).forEach(c=>{
    hitosOrden(c).forEach(hi=>{
      const d=Object.values(hi.datos||{}).filter(Boolean).join(' · ');
      items.push({f:hi.fecha,html:`<div class="tl-item ${hi.tipo==='ENTREGA'?'fin':''}"><b>Correctivo ${c.folio} — ${HITOS_DEF[hi.tipo].n}</b> · ${hi.fecha}<div class="tld">${hi.resp||''}${d?' · '+d:''}</div></div>`});
    });
    (c.seg||[]).forEach(sg=>{
      items.push({f:sg.fecha,html:`<div class="tl-item seg"><b>Correctivo ${c.folio} — Seguimiento</b> · ${sg.fecha}<div class="tld">${sg.txt}</div></div>`});
    });
  });
  items.sort((a,b)=>String(a.f).localeCompare(String(b.f)));
  const casosAb=CASOS.filter(c=>c.eqRef===idpart&&!c.cerrado).length;
  document.getElementById('modal').innerHTML=`
   <div class="overlay" onclick="if(event.target===this)closeReg()">
    <div class="modal wide">
     <h2>Ficha técnica</h2>
     <div class="msub">${e.equipo} · ${e.marca||''} ${e.modelo||''}</div>
     <div class="fgrid">
       <div><span class="lbl">Carpeta</span><br><b>${e.carpeta||'—'}</b></div>
       <div><span class="lbl">Inventario</span><br><b class="mono">${e.inv||'—'}</b></div>
       <div><span class="lbl">Serie</span><br><b class="mono">${e.serie||'—'}</b></div>
       <div><span class="lbl">Estado</span><br><span class="tag ${tagClass(e._estado)}">${e._estado}</span></div>
       <div><span class="lbl">Servicio</span><br><b>${e.servicio||'—'}</b></div>
       <div><span class="lbl">Unidad / Ubicación</span><br><b>${[e.unidad,e.ubic].filter(Boolean).join(' · ')||'—'}</b></div>
     </div>
     <div class="fsum">
       <span>${nProg} MP programadas</span><span style="color:var(--teal)">${nOk} realizadas</span>
       <span style="color:var(--amber)">${nCau} con causal</span><span style="color:var(--red)">${nPen} pendientes</span>
       ${casosAb?`<span style="color:var(--red)">${casosAb} caso correctivo abierto</span>`:''}
     </div>
     <div class="tl">${items.length?items.map(i=>i.html).join(''):'<div class="tld">Sin movimientos registrados en 2026.</div>'}</div>
     <div class="macts"><button class="m-cancel" style="flex:1" onclick="closeReg()">Cerrar</button></div>
    </div>
   </div>`;
  document.getElementById('modal').style.display='block';
}

function hitoCampos(){
  const tipo=document.getElementById('hTipo').value;
  const box=document.getElementById('hCampos');
  box.innerHTML=HITOS_DEF[tipo].campos.map(([k,n,ops])=>
    ops?`<label class="fl">${n}</label><select id="hc_${k}">${ops.map(o=>`<option>${o}</option>`).join('')}</select>`
       :`<label class="fl">${n}</label><input type="text" id="hc_${k}" style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit">`
  ).join('');
}
function submitHito(id){
  const c=CASOS.find(x=>x.id===id); if(!c)return;
  const tipo=document.getElementById('hTipo').value;
  const fecha=document.getElementById('hFecha').value;
  const resp=document.getElementById('hResp').value;
  if(!fecha){alert('Indica la fecha del hito.');return;}
  if(!resp){alert('Indica el responsable (todo hito lleva responsable).');return;}
  const datos={};
  HITOS_DEF[tipo].campos.forEach(([k])=>{const el=document.getElementById('hc_'+k);if(el)datos[k]=el.value.trim();});
  c.hitos.push({tipo,fecha,resp,datos});
  log('hito',`folio ${c.folio}: ${HITOS_DEF[tipo].n}, ${fecha}, ${resp}${Object.values(datos).filter(Boolean).length?' · '+Object.values(datos).filter(Boolean).join(', '):''}`);
  // 3. ENTREGA: cierre y verificación de MP con causal C2/C3/C4
  if(tipo==='ENTREGA'){
    c.cerrado=true;
    const e=eqDe(c.eqRef);
    if(e){
      let causalPend=null;
      MESES.forEach((m,i)=>{
        const mv=e.meses[m];
        const rOf=mv?mv[1]:'';
        const g=REG[(eqIdPart(e))+'|'+m];
        const res=(g&&g.res)||rOf;
        if(['C2','C3','C4'].includes(res)){
          const ejecDespues=MESES.some((m2,j)=>{
            if(j<i)return false;
            const mv2=e.meses[m2];const g2=REG[(eqIdPart(e))+'|'+m2];
            const r2=(g2&&g2.res)||(mv2?mv2[1]:'');
            return r2==='Si'||r2==='Si-RA';
          });
          if(!ejecDespues)causalPend={mes:m,causal:res};
        }
      });
      if(causalPend){
        const mesHoy=MESES[new Date().getMonth()];
        const kNew=eqIdPart(e)+'|'+mesHoy;
        const ofic=e.meses[mesHoy]&&e.meses[mesHoy][0];
        if(!ofic&&!VIRT[kNew]){VIRT[kNew]={origen:causalPend.mes,prog:'R'};saveVirt();}
        log('pendiente MP al retorno',`${e.equipo} (Inv ${e.inv}): causal ${causalPend.causal} de ${causalPend.mes} sin ejecutar → evento R creado en ${mesHoy}, límite hoy`);
        alert(`⚠ Este equipo tiene una MP con causal ${causalPend.causal} (${causalPend.mes}) sin ejecutar.\nEjecutar MP de inmediato al retorno: se creó un evento R en ${mesHoy} en el Plan MP (límite: hoy).`);
      }
    }
    log('caso cerrado',`folio ${c.folio}: entrega ${fecha}, equipo operativo`);
  }
  saveCasos();buildIndex();render();
  openCasoDet(id);
}

// ---- importar planilla oficial (.xlsm) ----
const VP=new Set(['X','R','RA','PM']);
const VRES=new Set(['Si','Si-RA','FS','No','NU','Baja','C1','C2','C3','C4','C5','C6','C7','C8']);
function importXlsm(inp){
  const f=inp.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets['Registro_MP-2026'];
      if(!ws){alert('Este botón es para la planilla oficial: el archivo debe contener la hoja "Registro_MP-2026".\nPara restaurar registros usa el botón "Backup registros".');inp.value='';return;}
      const arr=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
      const out=[];
      for(let i=7;i<arr.length;i++){
        const r=arr[i]; if(!r||(!r[1]&&!r[4]))continue;
        const s=v=>String(v??'').trim();
        if(!s(r[4])||s(r[4]).toLowerCase()==='equipo')continue;
        const eq={id:s(r[1]),carpeta:s(r[2]),inv:s(r[3]),equipo:s(r[4]),servicio:s(r[5]),unidad:s(r[6]),ubic:s(r[7]),marca:s(r[9]),modelo:s(r[10]),serie:s(r[11]),enu:s(r[15]),frec:s(r[17]),resp:'',meses:{}};
        MESES.forEach((m,j)=>{
          let p=s(r[19+j*2]),res=s(r[20+j*2]);
          p=VP.has(p)?p:''; res=VRES.has(res)?res:'';
          if(p||res)eq.meses[m]=[p,res];
        });
        out.push(eq);
      }
      if(!out.length){alert('No se encontraron equipos en el archivo.');inp.value='';return;}
      ROWS=out; FUENTE=`${f.name} · importado ${new Date().toLocaleString('es-CL')}`;
      buildIndex(); filters={eq:{},pl:{},co:{}};
      try{window.storage.set('datos-mp-2026',JSON.stringify({fuente:FUENTE,rows:out}));}catch(err){}
      log('importar',`${f.name} (${out.length} equipos)`);
      render();
      alert(`Planilla importada: ${out.length} equipos, ${EVENTOS.length} eventos MP. Tus registros se mantienen.`);
    }catch(err){alert('Error al leer el archivo: '+err.message);}
    inp.value='';
  };
  rd.readAsArrayBuffer(f);
}
function importBackupFile(inp){
  const f=inp.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      if(!wb.Sheets['Registros MP']){alert('Este botón es para el backup: el archivo debe contener la hoja "Registros MP" (el Excel exportado desde este programa).\nPara la planilla oficial usa el botón "Planilla .xlsm".');inp.value='';return;}
      importBackup(wb,f.name);
    }catch(err){alert('Error al leer el archivo: '+err.message);}
    inp.value='';
  };
  rd.readAsArrayBuffer(f);
}
function importBackup(wb,fname){
  const arr=XLSX.utils.sheet_to_json(wb.Sheets['Registros MP'],{defval:'',raw:false});
  let nuevos=0,actualizados=0;
  arr.forEach(r=>{
    const inv=String(r['N° Inventario']||'').trim();
    const serie=String(r['Serie']||'').trim();
    const id=String(r['ID']||'').trim();
    const mes=String(r['Mes']||'').trim();
    if(!mes||(!inv&&!serie&&!id))return;
    let fecha=String(r['Fecha ejecución']||'').trim();
    const m=fecha.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
    if(m)fecha=`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    const key=(inv||serie||('id'+id))+'|'+mes;
    if(REG[key])actualizados++;else nuevos++;
    const e2={fecha,ej:String(r['Ejecutor']||'').trim(),oper:(v=>v.startsWith('s')?true:v.startsWith('n')?false:null)(String(r['Equipo operativo']||'').trim().toLowerCase()),obs:String(r['Observaciones']||'').trim()};
    const pr=String(r['Programa registrado']||'').trim(); if(['X','R','RA','PM'].includes(pr))e2.prog=pr;
    const rr=String(r['Resultado registrado']||'').trim(); if(RESULTADOS.includes(rr))e2.res=rr;
    if(String(r['Documento pendiente']||'').trim().toLowerCase().startsWith('s'))e2.pend=true;
    if(String(r['Conflicto resuelto']||'').trim().toLowerCase().startsWith('s'))e2.resuelto=true;
    if(String(r['Evento no oficial']||'').trim().toLowerCase().startsWith('s')){
      VIRT[key]={origen:String(r['Mes programado original']||'').trim(),prog:e2.prog||'R'};
    }
    REG[key]=e2;
  });
  if(wb.Sheets['Bitácora']){
    const bit=XLSX.utils.sheet_to_json(wb.Sheets['Bitácora'],{defval:'',raw:false});
    const vistos=new Set(BITACORA.map(b=>b.t+'|'+b.a+'|'+b.d));
    bit.forEach(b=>{
      const e={t:String(b['Fecha y hora']||''),a:String(b['Acción']||''),d:String(b['Detalle']||'')};
      if(e.t&&!vistos.has(e.t+'|'+e.a+'|'+e.d))BITACORA.push(e);
    });
    saveBitacora();
  }
  if(wb.Sheets['Correctivo']){
    const cf=XLSX.utils.sheet_to_json(wb.Sheets['Correctivo'],{defval:'',raw:false});
    const porId={};
    cf.forEach(r=>{
      const cid=Number(r['Caso ID']); if(!cid)return;
      if(!porId[cid]){
        porId[cid]={id:cid,eqRef:String(r['N° Inventario']||r['Serie']||'').trim(),folio:String(r['Folio SIGEM']||''),ing:String(r['Ingeniero']||''),fecha:String(r['Fecha inicio']||''),desc:String(r['Descripción']||''),cerrado:String(r['Cerrado']||'').toLowerCase().startsWith('s'),hitos:[],seg:[]};
      }
      if(String(r['Registro'])==='HITO'&&HITOS_DEF[String(r['Tipo'])]){
        porId[cid].hitos.push({tipo:String(r['Tipo']),fecha:String(r['Fecha']||''),resp:String(r['Responsable']||''),datos:{detalle:String(r['Detalle']||'')}});
      }else if(String(r['Registro'])==='SEGUIMIENTO'){
        porId[cid].seg.push({fecha:String(r['Fecha']||''),txt:String(r['Detalle']||'')});
      }
    });
    Object.values(porId).forEach(nc=>{
      const i=CASOS.findIndex(x=>x.id===nc.id);
      if(i>=0)CASOS[i]=nc;else CASOS.push(nc);
    });
    saveCasos();
  }
  saveVirt();buildIndex();
  saveReg();render();
  log('importar backup',`${fname}: ${nuevos} registros nuevos, ${actualizados} actualizados`);
  alert(`Backup restaurado desde ${fname}:\n• ${nuevos} registros nuevos\n• ${actualizados} actualizados\n${wb.Sheets['Bitácora']?'• Bitácora fusionada':''}`);
}
async function loadData(){
  try{
    const r=await window.storage.get('datos-mp-2026');
    if(r&&r.value){const d=JSON.parse(r.value);ROWS=d.rows;FUENTE=d.fuente;buildIndex();}
  }catch(e){}
  render();
}

// ---- exportar registros a Excel ----
function exportRegistros(){
  const filas=[];
  EVENTOS.forEach(ev=>{
    const g=REG[evKey(ev)]; if(!g)return;
    filas.push({ID:ev.eq.id,'N° Carpeta':ev.eq.carpeta,'N° Inventario':ev.eq.inv,Equipo:ev.eq.equipo,Marca:ev.eq.marca,Modelo:ev.eq.modelo,Serie:ev.eq.serie,Servicio:ev.eq.servicio,Mes:ev.mes,'Evento no oficial':ev.virt?'Sí':'No','Mes programado original':ev.virt?(ev.origen||''):'','Tipo de evento':ev.virt?'MP Reprogramada':(TIPO[ev.p]||'Mantención preventiva'),Programa:ev.p,'Resultado planilla':ev.r,'Programa registrado':g.prog||ev.p,'Resultado registrado':g.res||'Si','Fecha ejecución':g.fecha,Ejecutor:g.ej,'Equipo operativo':g.oper===true?'Sí':g.oper===false?'No':'','Documento pendiente':g.pend?'Sí':'No','Conflicto resuelto':g.resuelto?'Sí':'No',Observaciones:g.obs||''});
  });
  if(!filas.length&&!BITACORA.length){alert('Aún no hay registros para exportar.');return;}
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(filas.length?filas:[{Aviso:'Sin registros de MP'}]),'Registros MP');
  if(CASOS.length){
    const cf=[];
    CASOS.forEach(c=>{
      const e=eqDe(c.eqRef)||{};
      hitosOrden(c).forEach(hi=>{
        cf.push({'Caso ID':c.id,'N° Inventario':e.inv||'','Serie':e.serie||'','Equipo':e.equipo||'','Folio SIGEM':c.folio,'Ingeniero':c.ing,'Fecha inicio':c.fecha,'Descripción':c.desc||'','Cerrado':c.cerrado?'Sí':'No','Registro':'HITO','Tipo':hi.tipo,'Fecha':hi.fecha,'Responsable':hi.resp||'','Detalle':Object.values(hi.datos||{}).filter(Boolean).join(' | ')});
      });
      (c.seg||[]).forEach(sg=>{
        cf.push({'Caso ID':c.id,'N° Inventario':e.inv||'','Serie':e.serie||'','Equipo':e.equipo||'','Folio SIGEM':c.folio,'Ingeniero':c.ing,'Fecha inicio':c.fecha,'Descripción':c.desc||'','Cerrado':c.cerrado?'Sí':'No','Registro':'SEGUIMIENTO','Tipo':'','Fecha':sg.fecha,'Responsable':'','Detalle':sg.txt});
      });
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(cf),'Correctivo');
  }
  if(BITACORA.length){
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(BITACORA.map(b=>({'Fecha y hora':b.t,Acción:b.a,Detalle:b.d}))),'Bitácora');
  }
  XLSX.writeFile(wb,`Registros_MP_${new Date().toISOString().slice(0,10)}.xlsx`);
  log('exportar',`${filas.length} registros`);
}

// ---- bitácora de uso (REC) ----
let RECON=false, BITACORA=[];
async function loadBitacora(){
  try{const r=await window.storage.get('bitacora-mp-2026');if(r&&r.value){const d=JSON.parse(r.value);RECON=d.on;BITACORA=d.log||[];}}catch(e){}
  document.getElementById('btnRec').classList.toggle('on',RECON);
}
function toggleRec(){
  RECON=!RECON;
  document.getElementById('btnRec').classList.toggle('on',RECON);
  BITACORA.push({t:new Date().toLocaleString('es-CL'),a:RECON?'grabación iniciada':'grabación detenida',d:''});
  saveBitacora();
}
function log(a,d){
  if(!RECON)return;
  BITACORA.push({t:new Date().toLocaleString('es-CL'),a,d:String(d||'')});
  if(BITACORA.length>2000)BITACORA=BITACORA.slice(-1500);
  saveBitacora();
}
let bitTimer=null;
function saveBitacora(){
  clearTimeout(bitTimer);
  bitTimer=setTimeout(()=>{try{window.storage.set('bitacora-mp-2026',JSON.stringify({on:RECON,log:BITACORA}));}catch(e){}},800);
}
let qTimer=null;
document.getElementById('q').addEventListener('input',e=>{
  clearTimeout(qTimer);
  qTimer=setTimeout(()=>{if(e.target.value.trim())log('búsqueda',`"${e.target.value.trim()}" en vista ${view==='eq'?'Equipos':'Plan MP'}`);},1200);
});

render();
loadReg();
loadData().then(loadVirt).then(loadCasos);
loadBitacora();
</script>
